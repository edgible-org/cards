apiVersion: v1
kind: Card
metadata:
  name: localai
  description: LocalAI, an OpenAI-compatible server for language, image and audio models on your own machine, its API on a key and its web UI behind org
  type: app
  added: 2026-11-06
  homepage: https://localai.io
  license: MIT
  steward: edgible-org

applications:
  - name: localai
    what: LocalAI OpenAI-compatible API, for apps that call a model
    from: localai/localai:v4.4.0
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    verifyPath: /readyz
    place: localai

  - name: localai-ui
    what: LocalAI's web UI, same process as localai
    from: localai/localai:v4.4.0
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: localai

data:
  volumes:
    # The models you download or import, and their configuration files.
    localai-models:
      class: irreplaceable
    # The inference backends LocalAI downloads on demand; it fetches them again when missing.
    localai-backends:
      class: rebuildable
  fingerprint:
    service: localai
    command: >-
      echo "{\"models\": $(ls /models/*.yaml 2>/dev/null | wc -l)}"

places:
  localai:
    memory: 4 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: optional
