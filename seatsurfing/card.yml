apiVersion: v1
kind: Card
metadata:
  name: seatsurfing
  description: Seatsurfing booking for desks, rooms and courts, open to your members on the app's own accounts
  type: app
  added: 2026-11-06
  homepage: https://seatsurfing.io
  license: GPL-3.0-only

applications:
  - name: seatsurfing
    what: Seatsurfing booking site, for the members who book and the admins who run it
    from: ghcr.io/seatsurfing/backend:1.140.1
    database: postgres:17.11-alpine
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: seatsurfing

data:
  volumes:
    seatsurfing-db-data:
      class: irreplaceable
      dump:
        service: seatsurfing-db
        command: pg_dump -U seatsurfing -Fc seatsurfing
        restore: pg_restore -U seatsurfing -d seatsurfing --clean
    seatsurfing-secrets:
      class: irreplaceable
    seatsurfing-shell:
      class: cache
  fingerprint:
    service: seatsurfing-db
    command: psql -U seatsurfing -d seatsurfing -tAc "select json_build_object('users', (select count(*) from users), 'spaces', (select count(*) from spaces), 'bookings', (select count(*) from bookings))"

secrets:
  SEATSURFING_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: seatsurfing-db
      command: psql -U seatsurfing -d seatsurfing -c "ALTER USER seatsurfing PASSWORD '$SEATSURFING_DB_PASSWORD'"
  SEATSURFING_CRYPT_KEY:
    kind: internal
    use: encryption
    make: openssl rand -hex 16
  SEATSURFING_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in
  SEATSURFING_SMTP_PASSWORD:
    kind: external
    from: your mail provider, with SEATSURFING_SMTP_USER
    required: false

places:
  seatsurfing:
    memory: 512 MB
    disk: 2 GB
    arch: [amd64, arm64]
    gpu: none
