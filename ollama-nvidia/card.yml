apiVersion: v1
kind: Card
metadata:
  name: ollama-nvidia
  description: Ollama on a Linux machine's NVIDIA GPU, in Docker, as an API behind a key
  type: app
  added: 2026-11-08
  homepage: https://ollama.com
  license: MIT
  steward: edgible-org

applications:
  - name: ollama
    what: Ollama API on the machine's NVIDIA GPU, through a small Caddy proxy that lets a key use models but not manage them
    from: ollama/ollama:0.40.15
    port: 21434
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: ollama

data:
  volumes:
    # The downloaded models. They can be pulled again from the Ollama library.
    ollama-nvidia-models:
      class: cache

places:
  ollama:
    memory: 8 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: required
