apiVersion: v1
kind: Card
metadata:
  name: speaches
  description: Speaches, an OpenAI-compatible API for transcription and speech on your own machine, its API on a key and its web page behind org
  type: app
  added: 2026-11-06
  homepage: https://github.com/speaches-ai/speaches
  steward: edgible-org

applications:
  - name: speaches
    what: Speaches' OpenAI-compatible API, for the apps that transcribe audio and speak text
    from: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    port: 8000
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: speaches

  - name: speaches-ui
    what: Speaches' web page for trying models, same process as speaches
    from: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    port: 8000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: speaches

data:
  volumes:
    # The speech models downloaded from Hugging Face. The app fetches them again on request,
    # but they are large and slow to fetch, so they are kept.
    speaches-models:
      class: rebuildable
  fingerprint:
    service: speaches
    command: >-
      echo "{\"models\": $(ls /home/ubuntu/.cache/huggingface/hub 2>/dev/null | grep -c '^models--')}"

places:
  speaches:
    memory: 2 GB
    disk: 6 GB
    arch: [amd64, arm64]
    gpu: none
