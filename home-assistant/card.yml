apiVersion: v1
kind: Card
metadata:
  name: home-assistant
  description: Home Assistant, one app for all your smart devices, with automations that keep running without the cloud, kept on your own machine, with a web interface and phone apps
  type: app
  added: 2026-10-31
  homepage: https://home-assistant.io/
  license: Apache-2.0
  steward: edgible-org

applications:
  - name: home-assistant
    what: Home Assistant's web interface, behind the Edgible sign-in
    from: ghcr.io/home-assistant/home-assistant:2026.10.4
    port: 8123
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: home-assistant

  - name: home-assistant-app
    what: The same Home Assistant, for its companion phone apps, which have only Home Assistant's own login
    from: ghcr.io/home-assistant/home-assistant:2026.10.4
    port: 8124
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: home-assistant

secrets:
  HOME_ASSISTANT_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in, set by prepare.sh; change it under your profile after

data:
  volumes:
    home-assistant-config:
      class: irreplaceable
    home-assistant-secrets:
      class: irreplaceable
  fingerprint:
    service: home-assistant
    command: |-
      python3 -c "import json,os;n=lambda p,k:len([x for x in json.load(open(p))['data'][k] if not x.get('system_generated')]) if os.path.exists(p) else 0;print(json.dumps({'users': n('/config/.storage/auth','users'), 'devices': n('/config/.storage/core.device_registry','devices')}))"

places:
  home-assistant:
    memory: 1 GB
    disk: 4 GB
    arch: [amd64, arm64]
    gpu: none
