apiVersion: v1
kind: Card
metadata:
  name: photoprism
  description: PhotoPrism, a private photo library with face, place and label search, on MariaDB
  type: app
  added: 2026-11-01
  homepage: https://photoprism.app
  license: AGPL-3.0-only
  steward: edgible-org

applications:
  - name: photoprism
    what: PhotoPrism, the web interface and WebDAV phone uploads
    from: photoprism/photoprism:260601
    database: mariadb:11.8.9
    port: 2342
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: photoprism

secrets:
  PHOTOPRISM_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    on-move: carry            # MariaDB keeps it in its data, and its root password is random
  PHOTOPRISM_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in, made at first start; change it under Settings, Account after

data:
  volumes:
    photoprism-originals:
      class: irreplaceable
    photoprism-storage:
      class: irreplaceable
    photoprism-db-data:
      class: irreplaceable
      dump:
        service: photoprism-db
        command: mariadb-dump -u"$MARIADB_USER" -p"$(cat /run/card-secrets/PHOTOPRISM_DB_PASSWORD)" "$MARIADB_DATABASE"
        restore: mariadb -u"$MARIADB_USER" -p"$(cat /run/card-secrets/PHOTOPRISM_DB_PASSWORD)" "$MARIADB_DATABASE"
    photoprism-secrets:
      class: irreplaceable
  fingerprint:
    service: photoprism-db
    command: mariadb -N -u"$MARIADB_USER" -p"$(cat /run/card-secrets/PHOTOPRISM_DB_PASSWORD)" "$MARIADB_DATABASE" -e "select json_object('photos', (select count(*) from photos), 'files', (select count(*) from files))"

places:
  photoprism:
    memory: 2 GB
    disk: 5 GB
    arch: [amd64, arm64]
    gpu: none
