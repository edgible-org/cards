apiVersion: v1
kind: Card
metadata:
  name: owncloud
  description: ownCloud Infinite Scale, your files and shares, for its desktop and phone apps and the web
  type: app
  added: 2026-10-13
  homepage: https://owncloud.dev/ocis/
  steward: edgible-org

applications:
  - name: owncloud
    what: ownCloud web, WebDAV, and its desktop and phone apps
    from: owncloud/ocis:8.2.1
    port: 9200
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    appPaths:
      - paths: [/remote.php/*, /dav/*, /ocs/*, /graph/*, /api/*, /app/*, /data/*, /status.php, /.well-known/*, /konnect/v1/token, /konnect/v1/jwks.json, /konnect/v1/userinfo]
        for: its desktop and phone apps and WebDAV clients, each with an ownCloud token or password
      - paths: [/s/*, /js/*, /themes/*, /icons/*, /fonts/*, /config.json, /manifest.json]
        for: public links, so people outside your organisation can open a file or folder shared with them
    place: owncloud

secrets:
  OWNCLOUD_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -base64 18 | tr -d '/+='
    for: admin's sign-in, read by ownCloud on its first start

places:
  owncloud:
    memory: 1 GB
    disk: 3 GB
    arch: [amd64, arm64]
    gpu: none
