apiVersion: v1
kind: Card
metadata:
  name: frigate
  description: Frigate, a security camera recorder that finds people and cars on your own machine, behind your org login
  type: app
  added: 2026-10-29
  homepage: https://frigate.video/
  license: MIT
  steward: edgible-org

applications:
  - name: frigate
    what: Frigate's web interface, for live views, recordings and detections
    from: ghcr.io/blakeblackshear/frigate:0.17.1
    port: 5000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: frigate

data:
  volumes:
    frigate-config:
      class: irreplaceable
    frigate-media:
      class: irreplaceable
  fingerprint:
    service: frigate
    command: 'python3 -c "import sqlite3,json;c=sqlite3.connect(\"file:/config/frigate.db?mode=ro\",uri=True);print(json.dumps({\"events\":c.execute(\"select count(*) from event\").fetchone()[0]}))"'

places:
  frigate:
    memory: 2 GB
    disk: 20 GB
    arch: [amd64, arm64]
    gpu: optional
