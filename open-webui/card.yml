apiVersion: v1
kind: Card
metadata:
  name: open-webui
  description: Open WebUI, a private chat with AI models and your own documents, on models you run yourself or ones you bring a key for
  type: app
  added: 2026-11-06
  homepage: https://openwebui.com
  license: BSD-3-Clause
  steward: edgible-org

applications:
  - name: open-webui
    what: Open WebUI, chat and document questions
    from: ghcr.io/open-webui/open-webui:v0.12.5
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: open-webui

secrets:
  OPEN_WEBUI_SECRET_KEY:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  OPEN_WEBUI_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in; the admin is made at first start, and sign-up is closed
  OPENAI_API_KEY:
    kind: external
    from: your model provider, or the litellm card's gateway (an OpenAI-compatible key), for models that do not run on this machine
    required: false

data:
  volumes:
    # Accounts, chats, settings, uploaded documents and their search index.
    open-webui-data:
      class: irreplaceable
    open-webui-secrets:
      class: irreplaceable
  fingerprint:
    service: open-webui
    command: >-
      python3 -c "import sqlite3,json; c=sqlite3.connect('file:/app/backend/data/webui.db?mode=ro',uri=True); print(json.dumps({'users': c.execute('select count(*) from user').fetchone()[0], 'chats': c.execute('select count(*) from chat').fetchone()[0]}))"

places:
  open-webui:
    memory: 2 GB
    disk: 6 GB
    arch: [amd64, arm64]
    gpu: none
