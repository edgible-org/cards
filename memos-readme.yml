why: >-
  You want private notes you can reach from any device, or shared notes for a family or a small
  team, written in markdown on a server you own. [Memos](https://usememos.com/) is a note app that
  keeps everything in one SQLite file, has a fast web interface, and works with phone apps.
what: >-
  One Memos container, with its notes and uploads in one volume. It is published on one hostname
  on `org`, with the paths Memos' phone apps call (`/api/v1/` and attachments under `/file/`) left
  to Memos' own login: the apps cannot get past an Edgible sign-in, and each of their calls needs a
  Memos token or password. The web pages stay behind Edgible's sign-in, so anyone who uses them
  must be in your Edgible organization. A new Memos lets its first visitor register as the admin,
  and anyone register after, so those paths open only once you have made the admin and closed
  sign-up, in Set up. The admin adds family or team members under Settings, Members.
data: >-
  The notes and uploads are in the `memos-data` volume.
edit: >-
  Set `DEVICE` and `ORG_LABEL`. There are no passwords to fill: you make the admin on Memos's first
  page.
start: ""
setup:
  memos: >-
    Its first page makes the admin: a username and a password from a password manager. Then, in
    Settings, turn on the setting that disallows user registration, so nobody else can make an
    account once its app paths are open. The check below says `done` only when both are true.
verify:
  memos: >-
    In the phone app, give it the same address and the
    admin you made in Set up.
docs: [Memos, https://usememos.com/docs]
