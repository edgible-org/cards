apiVersion: v1
kind: Card
metadata:
  name: ntfy
  description: ntfy, push notifications to your phone from your own scripts, on its own logins
  type: app
  added: 2026-11-07
  homepage: https://github.com/binwiederhier/ntfy
  license: Apache-2.0 OR GPL-2.0-only
  steward: edgible-org
  status: deprecated
  reason: "Its first user can only be made by a command inside the app (ntfy user add), which Edgible cannot yet run in an app it manages."

applications:
  - name: ntfy
    what: ntfy, for the web app, the phone apps and publishing by HTTP
    from: binwiederhier/ntfy:v2.37.2
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    appPaths:
      - paths: ["/*"]
        for: its phone apps and scripts, which publish and subscribe on each topic's own path, with ntfy's users and access rules
    signInPaths:
      - paths: [/, /app, /account, /settings, /login, /signup]
        for: the web app
    place: ntfy

secrets:
  NTFY_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -base64 24
    for: the admin's first sign-in; add a login or token for each sender and phone, then stop using it

places:
  ntfy:
    memory: 128 MB
    disk: 1 GB
    arch: [amd64, arm64, arm]
    gpu: none
