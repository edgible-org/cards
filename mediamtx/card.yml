apiVersion: v1
kind: Card
metadata:
  name: mediamtx
  description: MediaMTX, a live media server for cameras and streams, watched in a browser over HLS
  type: app
  added: 2026-11-06
  homepage: https://mediamtx.org
  license: MIT
  steward: edgible-org

applications:
  - name: mediamtx
    what: HLS player and playlists for the streams on the server
    from: bluenviron/mediamtx:1.16.0
    port: 8888
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: mediamtx

secrets:
  MEDIAMTX_PUBLISH_PASSWORD:
    kind: external
    from: choose a long password; cameras use it with the user name publisher

places:
  mediamtx:
    memory: 512 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
