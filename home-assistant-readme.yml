why: >-
  Smart-home gear usually comes with a vendor's app and cloud: each brand of light, plug,
  thermostat and sensor has its own, and they stop working when the vendor's service does.
  [Home Assistant](https://home-assistant.io/) is one app on a machine you own that brings devices
  from thousands of brands together, with dashboards, automations and scenes, and keeps them
  working locally with no cloud. This card runs it and makes it reachable from outside the home.
what: >-
  One Home Assistant container with its configuration and database in one volume, on one hostname,
  on `org`, with its API left to Home Assistant's own login. The web interface stays behind
  Edgible's sign-in, so only members of your Edgible organization reach it. The companion phone
  apps cannot pass an Edgible sign-in for their background calls, so `/api/` (their calls,
  webhooks and live updates) and `/auth/token` go straight to Home Assistant, where each call needs
  a Home Assistant token. The apps also show the dashboards as a web page inside the app, which is
  behind Edgible's sign-in: sign in with Edgible there once. A new Home Assistant lets its first
  visitor make the owner, so the API opens only after you make the owner in Home Assistant's own
  onboarding. A one-time container writes a first `configuration.yaml` that trusts the local proxy,
  only when the volume has none. This card uses neither the host network nor USB devices, so
  automatic discovery on the home network (mDNS and the like) and a USB radio such as a Zigbee or
  Z-Wave stick are out of reach; devices you add by address (MQTT, Hue, Shelly, Tasmota and many
  more) work. Home Assistant runs as root in its image.
data: >-
  The configuration, database, and every integration's settings are in the
  `home-assistant-config` volume.
edit: >-
  Set `DEVICE` and `ORG_LABEL`. Set `HOME_ASSISTANT_TZ` to your time zone, for automations that
  run at a time of day. There are no passwords to fill: you make the owner in Home Assistant's
  onboarding.
start: ""
setup:
  home-assistant: >-
    Its onboarding asks for the owner's name, username and password, then your home's name,
    location and units, and whether to share analytics. Use a password manager for the password:
    once the API is open, Home Assistant's login is what protects it.
verify:
  home-assistant: >-
    The first sign-in: open the address as an organization member, then sign in to Home Assistant
    as the owner you made in Set up. In the companion app, enter the same address, sign in with
    Edgible when the app shows its page, then with the same Home Assistant account.
docs: [Home Assistant, https://www.home-assistant.io/docs/]
