why: >-
  Smart-home gear usually comes with a vendor's app and cloud: each brand of light, plug,
  thermostat and sensor has its own, and they stop working when the vendor's service does.
  [Home Assistant](https://home-assistant.io/) is one app on a machine you own that brings devices
  from thousands of brands together, with dashboards, automations and scenes, and keeps them
  working locally with no cloud. This card runs it and makes it reachable from outside the home.
what: >-
  One Home Assistant container with its configuration and database in one volume, on two
  hostnames of the same process. `home-assistant` is the web interface, on `org`, so only members
  of your Edgible organization reach it. `home-assistant-app` is on `none`, because the Home
  Assistant companion phone apps cannot pass an Edgible sign-in; Home Assistant's own login is the
  protection there. A new Home Assistant lets its first visitor make the owner, so both hostnames
  start on `org` while you make the owner in Home Assistant's own onboarding; then only
  `home-assistant-app` opens. Use `home-assistant` in a browser, and give `home-assistant-app`
  only to the phone apps, or leave it unpublished if you use them only at home. A one-time
  container writes a first `configuration.yaml` that trusts the local proxy, only when the volume
  has none. This card uses neither the host network nor USB devices, so automatic discovery on
  the home network (mDNS and the like) and a USB radio such as a Zigbee or Z-Wave stick are out of
  reach; devices you add by address (MQTT, Hue, Shelly, Tasmota and many more) work. Home
  Assistant runs as root in its image.
data: >-
  The configuration, database, and every integration's settings are in the
  `home-assistant-config` volume.
edit: >-
  Set `DEVICE` and `ORG_LABEL`. Set `HOME_ASSISTANT_TZ` to your time zone, for automations that
  run at a time of day. There are no passwords to fill: you make the owner in Home Assistant's
  onboarding.
start: ""
setup:
  home-assistant: >-
    Its onboarding asks for the owner's name, username and password, then your home's name,
    location and units, and whether to share analytics. Use a password manager for the password:
    once `home-assistant-app` is open, Home Assistant's login is what protects it.
verify:
  home-assistant: >-
    The first sign-in: open the address as an organization member, then sign in to Home Assistant
    as the owner you made in Set up.
  home-assistant-app: >-
    The check signs in as the owner through this hostname, so it also proves a wrong password is
    refused. In the companion app, enter this hostname's address and sign in with the same
    account.
docs: [Home Assistant, https://www.home-assistant.io/docs/]
