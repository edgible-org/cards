apiVersion: v1
kind: Card
metadata:
  name: agent-zero
  description: Agent Zero, an autonomous AI agent with its own Linux desktop in a sandbox, behind your organisation's sign-in
  type: app
  added: 2026-11-15
  homepage: https://github.com/agent0ai/agent-zero
  status: experimental
  steward: edgible-org

applications:
  - name: agent-zero
    what: Agent Zero web UI
    from: agent0ai/agent-zero:v2.15
    port: 5080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: agent-zero

data:
  volumes:
    # Settings, chats, memory, projects and plugins: what makes the agent yours.
    agent-zero-data:
      class: irreplaceable
  fingerprint:
    service: agent-zero
    command: >-
      echo "{\"chats\": $(find /a0/usr -path '*chats*' -type f 2>/dev/null | wc -l | tr -d ' '),
      \"files\": $(find /a0/usr -type f 2>/dev/null | wc -l | tr -d ' ')}"

places:
  agent-zero:
    memory: 4 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: none
