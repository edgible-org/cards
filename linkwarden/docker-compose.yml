# Compose file for the linkwarden card.
# The host port, ORG_LABEL and the admin's name come from card.env. The passwords and keys are
# made on this machine by linkwarden-secrets, at first start, and never leave it. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait
# Sign-up is closed. prepare.sh opens it for one local request to make the admin, then closes it.

name: linkwarden

services:
  # Makes each secret in card.yml's secrets: that does not exist yet, one file each in the
  # volume linkwarden-secrets, then exits. It never changes one that exists.
  linkwarden-secrets:
    image: ghcr.io/edgible-org/card-secrets:0.1.2
    restart: "no"
    environment:
      CARD_SECRETS: |
        LINKWARDEN_DB_PASSWORD=openssl rand -hex 16
        LINKWARDEN_AUTH_SECRET=openssl rand -base64 32
        LINKWARDEN_ADMIN_PASSWORD=openssl rand -hex 16
    volumes:
      - linkwarden-secrets:/run/card-secrets

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.16.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LINKWARDEN_PORT:?set LINKWARDEN_PORT in card.env}:3000"
    # Linkwarden reads its settings only from the environment, so it starts through the loader,
    # which sets them from the secret files and then runs the image's own start command.
    entrypoint: ["sh", "/run/card-secrets/.load", "sh", "-c"]
    command:
      - >-
        export DATABASE_URL="postgresql://linkwarden:$$LINKWARDEN_DB_PASSWORD@linkwarden-db:5432/linkwarden"
        NEXTAUTH_SECRET="$$LINKWARDEN_AUTH_SECRET"
        PATH=/data/node_modules/.bin:$$PATH
        && prisma migrate deploy --schema=/data/packages/prisma/schema.prisma
        && exec concurrently -k -n web,worker "cd /data/apps/web && exec next start" "cd /data/apps/worker && exec tsx worker.ts"
    environment:
      NEXTAUTH_URL: ${LINKWARDEN_URL:-https://linkwarden.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}/api/v1/auth
      # Closed to strangers. Only prepare.sh opens it, for the first admin. The admin adds
      # everyone else under Admin Panel.
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${LINKWARDEN_DISABLE_REGISTRATION:-true}
    volumes:
      - linkwarden-data:/data/data
      - linkwarden-secrets:/run/card-secrets:ro
    depends_on:
      linkwarden-db:
        condition: service_healthy
    # The image's own healthcheck applies.

  linkwarden-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD_FILE: /run/card-secrets/LINKWARDEN_DB_PASSWORD
    volumes:
      - linkwarden-db-data:/var/lib/postgresql/data
      - linkwarden-secrets:/run/card-secrets:ro
    depends_on:
      linkwarden-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden -d linkwarden"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  linkwarden-data: {}
  linkwarden-db-data: {}
  linkwarden-secrets: {}
