apiVersion: v1
kind: Card
metadata:
  name: linkwarden
  description: Linkwarden, a bookmark manager that saves a copy of each page, behind its own login
  type: app
  added: 2026-11-01
  homepage: https://linkwarden.app
  license: MIT
  steward: edgible-org

applications:
  - name: linkwarden
    what: Linkwarden, for the web, the browser extension and the phone app
    from: ghcr.io/linkwarden/linkwarden:v2.16.3
    database: postgres:17.11-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: linkwarden

data:
  volumes:
    linkwarden-db-data:
      class: irreplaceable
      dump:
        service: linkwarden-db
        command: pg_dump -U linkwarden -Fc linkwarden
        restore: pg_restore -U linkwarden -d linkwarden --clean
    linkwarden-data:
      class: irreplaceable
    linkwarden-secrets:
      class: irreplaceable
  fingerprint:
    service: linkwarden-db
    command: psql -U linkwarden -d linkwarden -tAc "select json_build_object('users', (select count(*) from \"User\"), 'links', (select count(*) from \"Link\"))"

secrets:
  LINKWARDEN_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: linkwarden-db
      command: psql -U linkwarden -d linkwarden -c "ALTER USER linkwarden PASSWORD '$LINKWARDEN_DB_PASSWORD'"
  LINKWARDEN_AUTH_SECRET:
    kind: internal
    use: signing
    make: openssl rand -base64 32
  LINKWARDEN_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in, made by prepare.sh; change it under Settings after

places:
  linkwarden:
    memory: 2 GB
    disk: 4 GB
    arch: [amd64, arm64]
    gpu: none
