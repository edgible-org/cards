apiVersion: v1
kind: Card
metadata:
  name: kokoro-fastapi
  description: Kokoro-FastAPI, text to speech with an OpenAI-compatible API on your own CPU, its API on a key and its demo page behind org
  type: app
  added: 2026-11-15
  homepage: https://github.com/remsky/Kokoro-FastAPI
  steward: edgible-org

applications:
  - name: kokoro-fastapi
    what: Kokoro's OpenAI-compatible speech API, for the apps that turn text into voice
    from: ghcr.io/remsky/kokoro-fastapi-cpu:v0.3.0
    port: 8880
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: kokoro-fastapi

  - name: kokoro-fastapi-ui
    what: Kokoro's web page (/web) for trying voices, same process as kokoro-fastapi
    from: ghcr.io/remsky/kokoro-fastapi-cpu:v0.3.0
    port: 8880
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: kokoro-fastapi

places:
  kokoro-fastapi:
    memory: 2 GB
    disk: 6 GB
    arch: [amd64, arm64]
    gpu: none
