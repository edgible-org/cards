apiVersion: v1
kind: Card
metadata:
  name: grafana-mcp
  description: Grafana's MCP server, so your AI assistants can read your dashboards and metrics, behind a key per person
  type: app
  added: 2026-11-06
  homepage: https://github.com/grafana/mcp-grafana
  license: Apache-2.0
  steward: edgible-org

applications:
  - name: grafana-mcp
    what: Grafana MCP server over Streamable HTTP, for AI assistants
    from: grafana/mcp-grafana:2.2.0
    port: 8000
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: grafana-mcp

secrets:
  GRAFANA_MCP_SERVICE_ACCOUNT_TOKEN:
    kind: external
    from: your Grafana, under Administration, Users and access, Service accounts (a Viewer account for read-only use)

places:
  grafana-mcp:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
