apiVersion: v1
kind: Card
metadata:
  name: papra
  description: Papra, a minimalist archive for your paperwork, with search and tags, behind your org login
  type: app
  added: 2026-11-18
  homepage: https://papra.app
  license: AGPL-3.0-only
  steward: edgible-org

applications:
  - name: papra
    what: Papra document archive, for the people who file and search documents in a browser
    from: ghcr.io/papra-hq/papra:26.7.1-rootless
    port: 1221
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: papra

secrets:
  PAPRA_AUTH_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 48

data:
  volumes:
    papra-data:
      class: irreplaceable
    papra-secrets:
      class: irreplaceable
  fingerprint:
    service: papra
    command: node -e "const {DatabaseSync}=require('node:sqlite'); const d=new DatabaseSync('/app/app-data/db/db.sqlite',{readOnly:true}); const n=t=>d.prepare('select count(*) as n from '+t).get().n; console.log(JSON.stringify({users:n('users'),documents:n('documents')}))"

places:
  papra:
    memory: 512 MB
    disk: 2 GB
    arch: [amd64, arm64]
    gpu: none
