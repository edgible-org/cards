apiVersion: v1
kind: Card
metadata:
  name: hedgedoc
  description: HedgeDoc, realtime collaborative markdown notes, behind your org login
  type: app
  added: 2026-11-12
  homepage: https://hedgedoc.org/
  license: AGPL-3.0-only
  steward: edgible-org

applications:
  - name: hedgedoc
    what: HedgeDoc collaborative markdown notes
    from: quay.io/hedgedoc/hedgedoc:1.10.8
    database: postgres:17.11-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: hedgedoc

secrets:
  HEDGEDOC_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: hedgedoc-db
      command: psql -U hedgedoc -d hedgedoc -c "ALTER USER hedgedoc PASSWORD '$HEDGEDOC_DB_PASSWORD'"
  HEDGEDOC_SESSION_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  HEDGEDOC_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the first account's sign-in, made by prepare.sh; change it under the profile menu after

data:
  volumes:
    hedgedoc-db-data:
      class: irreplaceable
      dump:
        service: hedgedoc-db
        command: pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB"
        restore: pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean
    hedgedoc-uploads:
      class: irreplaceable
    hedgedoc-secrets:
      class: irreplaceable
  fingerprint:
    service: hedgedoc-db
    command: psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select json_build_object('users', (select count(*) from \"Users\"), 'notes', (select count(*) from \"Notes\"))"

places:
  hedgedoc:
    memory: 512 MB
    disk: 2 GB
    arch: [amd64, arm64]
    gpu: none
