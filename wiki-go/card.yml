apiVersion: v1
kind: Card
metadata:
  name: wiki-go
  description: Wiki-Go, a databaseless flat-file team wiki with roles and page access rules, behind your org login
  type: app
  added: 2026-10-28
  homepage: https://leomoon.com/downloads/web-apps/wiki-go/
  license: GPL-3.0-only
  steward: edgible-org

applications:
  - name: wiki-go
    what: Wiki-Go wiki, for the people who read and edit it in a browser
    from: leomoonstudios/wiki-go:1.9.2
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    setup:
      behind: org
      done: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$WIKI_GO_PORT/api/login" -H 'Content-Type:application/json' -d '{"username":"admin","password":"admin"}')" = 401
    place: wiki-go

data:
  volumes:
    wiki-go-data:
      class: irreplaceable
  fingerprint:
    service: wiki-go
    command: 'printf ''{"documents": %s}\n'' "$(find /wiki/data/documents -name document.md 2>/dev/null | wc -l | tr -d '' '')"'

places:
  wiki-go:
    memory: 256 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
