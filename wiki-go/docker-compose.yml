# Compose file for the wiki-go card.
# The host port comes from card.env. Wiki-Go starts with the user admin and the password
# admin; you change it in the wiki, behind the Edgible sign-in (README, Set up). Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait

name: wiki-go

services:
  wiki-go:
    image: ${WIKI_GO_IMAGE:-leomoonstudios/wiki-go:1.9.6}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WIKI_GO_PORT:?set WIKI_GO_PORT in card.env}:8080"
    volumes:
      # Pages, uploads, users and settings (config.yaml) are all files in here.
      - wiki-go-data:/wiki/data
    # The image has no healthcheck of its own.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  wiki-go-data: {}
