apiVersion: v1
kind: Card
metadata:
  name: vaultwarden
  description: Vaultwarden, a Bitwarden-compatible password server, for your own apps and browsers
  type: app
  added: 2026-10-09
  homepage: https://github.com/dani-garcia/vaultwarden
  steward: edgible-org

applications:
  - name: vaultwarden
    what: Vaultwarden, for Bitwarden apps and the web vault
    from: vaultwarden/server:1.37.5
    port: 8222
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    appPaths:
      - paths: [/identity/connect/token, /identity/accounts/prelogin, /identity/accounts/prelogin/password]
        for: the Bitwarden apps' sign-in, with each person's Vaultwarden password
      - paths: [/api/*]
        for: the Bitwarden apps' vault calls, each with a Vaultwarden token
      - paths: [/notifications/*, /events/*]
        for: the Bitwarden apps' live sync and events, each with a Vaultwarden token
      - paths: [/icons/*]
        for: site icons in the Bitwarden apps, with no vault data
    place: vaultwarden

secrets:
  VAULTWARDEN_ADMIN_TOKEN:
    kind: human
    make: openssl rand -base64 48
    for: the /admin page, where you invite people

places:
  vaultwarden:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm, arm64]
    gpu: none
