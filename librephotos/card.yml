apiVersion: v1
kind: Card
metadata:
  name: librephotos
  description: LibrePhotos, your photo library with face, place and object search, behind its own login
  type: app
  added: 2026-11-17
  homepage: https://docs.librephotos.com
  license: MIT
  steward: edgible-org

applications:
  - name: librephotos
    what: LibrePhotos web app, API, and uploads
    from: reallibrephotos/librephotos-unified:1.6.0
    database: postgres:18-alpine
    port: 8001
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: librephotos

secrets:
  LIBREPHOTOS_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: librephotos-db
      command: psql -U librephotos -d librephotos -c "ALTER USER librephotos PASSWORD '$LIBREPHOTOS_DB_PASSWORD'"
  LIBREPHOTOS_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's sign-in, user name admin

places:
  librephotos:
    memory: 4 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: optional
