<svg class="ya-art" viewBox="20 30 1000 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ya-title">
<title id="ya-title">Adding your app: you build an app, check it has what a card needs, test it on your own Edgible, open a pull request, Edgible reads and tests it, and it is listed in the catalog for everyone. Other people run it, improve it and share their own, and the catalog grows.</title>
<style>
.ya-art{--a-ink:#000033;--a-muted:#4a4f66;--a-mid:#2e4a9e;--a-ring:#e8743b;--a-bg:#f5f6fa}
@media (prefers-color-scheme:dark){.ya-art{--a-ink:#e8eaf4;--a-muted:#a3a8bf;--a-bg:#0d1020}}
.ya-art text{font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
<defs><marker id="ya-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a-ring)"/></marker>
<filter id="ya-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000033" flood-opacity=".2"/></filter></defs>
<path d="M137 120 H218" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ya-arrow)"/>
<path d="M304 120 H386" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ya-arrow)"/>
<path d="M472 120 H554" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ya-arrow)"/>
<path d="M640 120 H722" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ya-arrow)"/>
<path d="M808 120 H881" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ya-arrow)"/>
<path d="M933 245 C 933 345, 95 345, 95 235" fill="none" stroke="var(--a-ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#ya-arrow)"/><text x="514" y="332" text-anchor="middle" font-size="18" font-weight="600" fill="var(--a-muted)">others run it, improve it, and add their own</text>
<g transform="translate(95 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ya-shadow)"/><circle cx="0" cy="-8" r="8" fill="#fff"/><path d="M-15 17 a15 13 0 0 1 30 0 z" fill="#fff"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">You built</tspan><tspan x="0" dy="25">an app</tspan></text></g>
<g transform="translate(262 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ya-shadow)"/><rect x="-14" y="-18" width="28" height="36" rx="4" fill="#fff"/><path d="M-8 -7 l3 3 l5 -6 M-8 4 l3 3 l5 -6" fill="none" stroke="var(--a-mid)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="3" y1="-6" x2="9" y2="-6" stroke="var(--a-mid)" stroke-width="2.5"/><line x1="3" y1="5" x2="9" y2="5" stroke="var(--a-mid)" stroke-width="2.5"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Check what a</tspan><tspan x="0" dy="25">card needs</tspan></text></g>
<g transform="translate(430 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ya-shadow)"/><rect x="-18" y="-15" width="36" height="24" rx="4" fill="#fff"/><rect x="-10" y="11" width="20" height="4" rx="2" fill="#fff"/><path d="M-7 -3 l5 5 l10 -10" fill="none" stroke="#1d9a4a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Test it on your</tspan><tspan x="0" dy="25">own Edgible</tspan></text></g>
<g transform="translate(598 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ya-shadow)"/><circle cx="-9" cy="-12" r="4" fill="#fff"/><circle cx="-9" cy="12" r="4" fill="#fff"/><circle cx="10" cy="-4" r="4" fill="#fff"/><path d="M-9 -8 V8 M-9 4 C-9 -2 10 4 10 0" fill="none" stroke="#fff" stroke-width="2.5"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Open a</tspan><tspan x="0" dy="25">pull request</tspan></text></g>
<g transform="translate(766 120)"><circle r="34" fill="var(--a-mid)" filter="url(#ya-shadow)"/><circle cx="-3" cy="-3" r="12" fill="none" stroke="#fff" stroke-width="4"/><path d="M6 6 L16 16" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="0" y="62" text-anchor="middle" font-size="21" fill="var(--a-ink)"><tspan x="0">Edgible reads</tspan><tspan x="0" dy="25">and tests it</tspan></text></g>
<g transform="translate(933 120)" filter="url(#ya-shadow)"><circle r="52" fill="#1d9a4a"/><g fill="#fff"><circle cx="-24" cy="-6" r="8"/><path d="M-37 22 a13 12 0 0 1 26 0 z"/><circle cx="24" cy="-6" r="8"/><path d="M11 22 a13 12 0 0 1 26 0 z"/><circle cx="0" cy="-14" r="9"/><path d="M-14 16 a14 13 0 0 1 28 0 z"/></g></g>
<text x="933" y="198" text-anchor="middle" font-size="21" fill="var(--a-ink)">Listed for</text><text x="933" y="223" text-anchor="middle" font-size="21" fill="var(--a-ink)">everyone</text>
</svg>
