apiVersion: v1
kind: Card
metadata:
  name: umami
  description: Umami analytics, the dashboard behind org and the tracking script open
  type: app
  added: 2026-10-09
  homepage: https://umami.is
  steward: edgible-org

applications:
  - name: umami
    what: Umami dashboard
    from: ghcr.io/umami-software/umami:3.4.0
    database: postgres:17.11-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    setup:
      behind: org
      done: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$UMAMI_PORT/api/auth/login" -H 'Content-Type:application/json' -d '{"username":"admin","password":"umami"}')" = 401
    place: umami

  - name: analytics
    what: Umami tracking script, same process as umami
    from: ghcr.io/umami-software/umami:3.4.0
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    setup:
      behind: org
      done: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$UMAMI_PORT/api/auth/login" -H 'Content-Type:application/json' -d '{"username":"admin","password":"umami"}')" = 401
    place: umami

secrets:
  UMAMI_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: umami-db
      command: psql -U umami -d umami -c "ALTER USER umami PASSWORD '$UMAMI_DB_PASSWORD'"
  UMAMI_APP_SECRET:
    kind: internal
    use: signing
    make: openssl rand -base64 32
  UMAMI_TWO_FACTOR_KEY:
    kind: internal
    use: encryption
    make: openssl rand -hex 32

places:
  umami:
    memory: 384 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
