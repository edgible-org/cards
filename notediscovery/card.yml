apiVersion: v1
kind: Card
metadata:
  name: notediscovery
  description: NoteDiscovery, a searchable Markdown library of your team's know-how, for people behind org login and AI assistants on an API key
  type: app
  added: 2026-11-01
  homepage: https://www.notediscovery.com/
  license: MIT
  steward: edgible-org

applications:
  - name: notediscovery
    what: The library, for people in a browser
    from: ghcr.io/gamosoft/notediscovery:0.33.0
    port: 8000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: notediscovery

  - name: notediscovery-mcp
    what: MCP and API, same process, for AI assistants
    from: ghcr.io/gamosoft/notediscovery:0.33.0
    port: 8000
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: notediscovery

data:
  volumes:
    # Every note and attachment, as plain files.
    notediscovery-data:
      class: irreplaceable
  fingerprint:
    service: notediscovery
    command: >-
      echo "{\"notes\": $(find /app/data -type f -name '*.md' | wc -l | tr -d ' ')}"

places:
  notediscovery:
    memory: 256 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
