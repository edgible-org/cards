apiVersion: v1
kind: Card
metadata:
  name: freshrss
  description: FreshRSS, a self-hosted feed reader, behind your org login on the web and its own login for phone apps
  type: app
  added: 2026-11-02
  homepage: https://freshrss.org/
  license: AGPL-3.0-only
  steward: edgible-org

applications:
  - name: freshrss
    what: FreshRSS, for the people who read feeds in a browser
    from: freshrss/freshrss:1.30.1
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: freshrss

  - name: freshrss-app
    what: FreshRSS, same process, for phone and desktop reader apps that use its API
    from: freshrss/freshrss:1.30.1
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: freshrss

secrets:
  FRESHRSS_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's sign-in to the web interface, made by FreshRSS on first start
  FRESHRSS_API_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the password a reader app is given, with the admin's name, to use the API

data:
  volumes:
    freshrss-data:
      class: irreplaceable
    freshrss-secrets:
      class: irreplaceable        # the card's secrets, made on the device: back up with the data
  fingerprint:
    service: freshrss
    command: >-
      php -r '$u=0;$f=0;foreach(glob("/var/www/FreshRSS/data/users/*/db.sqlite") as $p){$u++;$d=new PDO("sqlite:".$p);$f+=(int)$d->query("select count(*) from feed")->fetchColumn();}echo json_encode(["users"=>$u,"feeds"=>$f]);'

places:
  freshrss:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
