why: >-
  Films, shows and music you already own shouldn't need a subscription to watch.
  [Jellyfin](https://jellyfin.org) is a free media server that streams your own library to its TV,
  phone and desktop apps and to any browser, from a machine you own.
what: >-
  One app, `jellyfin`, on the place `jellyfin`, on `org`, with the web app (`/web/`) behind
  Edgible's sign-in and the rest of the site left to Jellyfin's own login. Jellyfin's TV, phone and
  desktop apps call its API at paths all over the site and cannot get past an Edgible sign-in, so
  those reach Jellyfin, where each call needs a Jellyfin token or password; anyone who uses the web
  app must be in your Edgible organization. Nobody can sign up: the admin adds everyone else.
  Until its setup wizard is finished, anyone who reaches Jellyfin can make the admin, so all of it
  stays behind Edgible's sign-in until then: you choose the language, your admin and password, and
  your libraries in the wizard, then open the paths for the apps.


  It runs one service, `jellyfin`, from the image Jellyfin publishes, pinned to
  `12.2.20261005-225228`. Your media folder is mounted read-only, so Jellyfin never changes your
  files. Hardware transcoding is optional: on Linux with an Intel or AMD GPU, uncomment the
  `devices:` lines in the Compose file. Without it, Jellyfin transcodes on the CPU, or not at all
  when the app plays the file as it is.


  To use it in a card, copy the `jellyfin` service, the two volumes, card.yml's `setup:`, and the
  `JELLYFIN_` lines.
data: >-
  Settings, users and watch history live in the volume `jellyfin-config`, and artwork and
  transcodes in `jellyfin-cache`. Back up `jellyfin-config`; the cache rebuilds. Your media stays
  in `JELLYFIN_MEDIA_DIR`, outside Docker. The memory below is Jellyfin's own documented minimum,
  which is higher than an empty test library measures; transcoding several streams wants more.
  The disk is for Jellyfin itself, not your media.
edit: >-
  Set `DEVICE` to a name `edgible device list` prints, and `JELLYFIN_MEDIA_DIR` to the full path
  of the folder that holds your media. Keep that folder outside `jellyfin/`, because the last Tear
  down step deletes `jellyfin/`. There is no password to fill: you choose the admin's in
  Jellyfin's setup wizard.
start: ""
setup:
  jellyfin: >-
    Jellyfin's wizard asks for the language, your admin and password, and your libraries: add one
    pointing at `/media`, your `JELLYFIN_MEDIA_DIR`. Keep "Allow remote connections" on, or
    Jellyfin turns away its own apps once their paths are open. Use a password manager for the password.
verify:
  jellyfin: >-
    In a Jellyfin app, set the server to `https://<jellyfin hostname>` and sign in with the
    admin you made in Set up.


    For a forgotten password, use "Forgot Password" on Jellyfin's sign-in page and follow what it
    says. When the admin is locked out and that does not work,
    [Jellyfin's troubleshooting page](https://jellyfin.org/docs/general/administration/troubleshooting/)
    unlocks it on the machine.
probe:
  jellyfin: /System/Info/Public
docs: [Jellyfin, https://jellyfin.org/docs]
