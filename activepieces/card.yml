apiVersion: v1
kind: Card
metadata:
  name: activepieces
  description: Activepieces automation, the editor behind org and the webhook hostname open
  type: app
  added: 2026-11-05
  homepage: https://www.activepieces.com
  license: MIT
  steward: edgible-org

applications:
  - name: activepieces
    what: Activepieces editor
    from: activepieces/activepieces:0.92.3-hotfix.2
    database: postgres:17.11-alpine
    port: 80
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: activepieces

  - name: activepieces-hooks
    what: Activepieces webhooks, same process as activepieces
    from: activepieces/activepieces:0.92.3-hotfix.2
    port: 80
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: activepieces

data:
  volumes:
    activepieces-db-data:
      class: irreplaceable
      dump:
        service: activepieces-db
        command: pg_dump -U activepieces -Fc activepieces
        restore: pg_restore -U activepieces -d activepieces --clean
    activepieces-secrets:
      class: irreplaceable
    activepieces-redis-data:
      class: cache
  fingerprint:
    service: activepieces-db
    command: psql -U activepieces -d activepieces -tAc "select json_build_object('users', (select count(*) from \"user\"), 'flows', (select count(*) from flow))"

secrets:
  ACTIVEPIECES_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: activepieces-db
      command: psql -U activepieces -d activepieces -c "ALTER USER activepieces PASSWORD '$ACTIVEPIECES_DB_PASSWORD'"
  ACTIVEPIECES_ENCRYPTION_KEY:
    kind: internal
    use: encryption
    make: openssl rand -hex 16
  ACTIVEPIECES_JWT_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  ACTIVEPIECES_ADMIN_PASSWORD:
    kind: human
    make: printf 'Ap1!%s' "$(openssl rand -hex 12)"
    for: the admin's sign-in, admin@example.com, made by prepare.sh

places:
  activepieces:
    memory: 2 GB
    disk: 4 GB
    arch: [amd64, arm64]
    gpu: none
