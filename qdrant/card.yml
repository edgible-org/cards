apiVersion: v1
kind: Card
metadata:
  name: qdrant
  description: Qdrant, a vector database for RAG, semantic search and agent memory, its API on a key and its dashboard behind org
  type: app
  added: 2026-10-31
  homepage: https://qdrant.tech
  license: Apache-2.0
  steward: edgible-org

applications:
  - name: qdrant
    what: Qdrant REST API, for the apps that store and search vectors
    from: qdrant/qdrant:v1.20.0
    port: 6333
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: qdrant

  - name: qdrant-dashboard
    what: Qdrant web dashboard, same process as qdrant
    from: qdrant/qdrant:v1.20.0
    port: 6333
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: qdrant

data:
  volumes:
    # Every collection, its vectors and payloads, and the snapshots.
    qdrant-data:
      class: irreplaceable
  fingerprint:
    service: qdrant
    command: >-
      echo "{\"collections\": $(ls /qdrant/storage/collections 2>/dev/null | wc -l)}"

places:
  qdrant:
    memory: 512 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
