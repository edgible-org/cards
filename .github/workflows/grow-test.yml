# One test of an agent-made card on a fleet machine, for the grow job (grow.yml calls it as
# test-1 and test-2). The fleet does not take the hub's word for the card: it checks it again
# with check-cards --untrusted --before-test before test-card runs it. The tested card, its
# test.yml and the logs go on as the artifact named by `to`.

name: grow-test

on:
  workflow_call:
    inputs:
      card:
        type: string
        required: true
      from:
        description: The artifact holding the card to test
        type: string
        required: true
      to:
        description: The artifact to keep the tested card and its logs in
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      result:
        description: pass, fail, or infra when the machine or the platform stopped the test, so the card was not properly tested
        value: ${{ jobs.test.outputs.result }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: [self-hosted, edgible-test]
    timeout-minutes: 120
    outputs:
      result: ${{ steps.test.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cards
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.from }}
          path: incoming
      - name: Sign in to Docker Hub
        # Anonymous pulls share a low limit per address. The credentials are written straight into a
        # config folder for this job, not with docker login: a config with no credentials in it, as an
        # empty folder is, makes Docker use the Mac's keychain, which a runner's service often cannot
        # reach, and then every pull and image lookup fails. So the token is checked first, and if it is
        # not accepted the job keeps the machine's own config, as it did before this step.
        # The token can only read public images, as an agent-written prepare.sh runs on this machine.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "no Docker Hub secrets: pulling anonymously"; exit 0
          fi
          # Through curl's config on stdin, so the token is not on a command line.
          code=$(printf 'user = "%s:%s"\n' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | curl -s -m 20 -o /dev/null -w '%{http_code}' -K - \
                 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull' || true)
          if [ "$code" != 200 ]; then
            echo "::warning::Docker Hub did not accept DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (HTTP $code): pulling anonymously."
            exit 0
          fi
          # A new config folder loses the machine's context and Compose plugin, so both are kept.
          docker_host=$(docker context inspect --format '{{.Endpoints.docker.Host}}')
          config=$(mktemp -d "${RUNNER_TEMP:-/tmp}/docker-config.XXXXXX")
          [ -d "$HOME/.docker/cli-plugins" ] && ln -s "$HOME/.docker/cli-plugins" "$config/cli-plugins"
          auth=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
          ( umask 077; printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$auth" > "$config/config.json" )
          { echo "DOCKER_CONFIG=$config"; echo "DOCKER_HOST=$docker_host"; } >> "$GITHUB_ENV"
          echo "signed in to Docker Hub"
      - name: Check and test the card
        id: test
        env:
          CARD: ${{ inputs.card }}
          # The machine's own device (TEST_DEVICE in its runner's .env), else the repository variable.
          FALLBACK_DEVICE: ${{ vars.TEST_DEVICE }}
        run: |
          set -euo pipefail
          DEVICE=${TEST_DEVICE:-$FALLBACK_DEVICE}
          if [ -n "${TEST_DEVICE:-}" ]; then echo "testing on $DEVICE (from this machine's runner .env)"; else echo "testing on $DEVICE (the repository's fallback; this machine sets no TEST_DEVICE)"; fi
          [ -n "$DEVICE" ] || { echo "set TEST_DEVICE in the runner's .env, or the repository variable TEST_DEVICE" >&2; exit 2; }
          [[ "$CARD" =~ ^[a-z0-9-]+$ ]] || { echo "not a card name: $CARD" >&2; exit 2; }
          rm -rf card-kit out test.log check.log
          git clone -q --depth 1 https://github.com/edgible-org/card-kit.git card-kit
          cp -R "incoming/$CARD" "cards/$CARD"
          cd cards
          if ! ../card-kit/run check-cards --untrusted --before-test "$CARD/card.yml" > ../check.log 2>&1; then
            cat ../check.log; result=fail
          elif python3 ../card-kit/test-card.py "$CARD" --device "$DEVICE" --by agent > ../test.log 2>&1; then
            tail -20 ../test.log; result=pass
          else
            tail -40 ../test.log; result=fail
            # Not the card: a registry's limit, Docker's credential helper, Docker itself, or the platform.
            if grep -qiE 'pull rate limit|toomanyrequests|error getting credentials|rw layer snapshot not found|cannot connect to the docker daemon|"code": "INTERNAL_ERROR"' ../test.log; then result=infra; fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Keep the tested card and the logs
        if: always()
        env:
          CARD: ${{ inputs.card }}
        run: |
          mkdir -p out
          cp -R "cards/$CARD" out/ 2>/dev/null || true
          cp incoming/NEW-CARD.md out/ 2>/dev/null || true
          cp test.log check.log out/ 2>/dev/null || true
          # Paths under this machine's home, as test-card prints them, stay off the shared logs.
          for f in out/test.log out/check.log; do [ -f "$f" ] && sed -i.bak -e "s#$HOME#~#g" "$f" && rm -f "$f.bak"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.to }}
          path: out/
          if-no-files-found: ignore
      - name: Clean up
        if: always()
        run: |
          rm -rf card-kit out incoming test.log check.log
          [ -z "${DOCKER_CONFIG:-}" ] || rm -rf "$DOCKER_CONFIG"
