# Compose file for the weaviate card: a vector database. The host port comes from card.env.
# Weaviate listens on 127.0.0.1 only; Edgible's api-key check is what keeps strangers out, so
# Weaviate's own sign-in is off. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait
# An app on the same machine can skip Edgible and call http://127.0.0.1:<WEAVIATE_PORT>, or
# http://weaviate:8080 on a shared Compose network.

name: weaviate

services:
  weaviate:
    image: ${WEAVIATE_IMAGE:-semitechnologies/weaviate:1.40.5}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEAVIATE_PORT:?set WEAVIATE_PORT in card.env}:8080"
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # No vectorizer modules: the caller brings its own embeddings.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  weaviate-data: {}
