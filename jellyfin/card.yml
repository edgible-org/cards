apiVersion: v1
kind: Card
metadata:
  name: jellyfin
  description: Jellyfin, your films, shows and music, streamed to its apps and the web
  type: app
  added: 2026-10-09
  homepage: https://jellyfin.org
  steward: edgible-org

applications:
  - name: jellyfin
    what: Jellyfin web, API, and its TV and phone apps
    from: jellyfin/jellyfin:12.2.20261005-225228
    port: 8096
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    verifyPath: /web/
    appPaths:
      - paths: ["/*"]
        for: Jellyfin's TV, phone and desktop apps, which call its API all over the site, each with a Jellyfin token or password
    signInPaths:
      - paths: ["/web/*"]
        for: the web app
    setup:
      behind: org
      done: curl -fsS "http://127.0.0.1:$JELLYFIN_PORT/System/Info/Public" | grep -q '"StartupWizardCompleted":true'
    place: jellyfin

places:
  jellyfin:
    memory: 4 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: optional
