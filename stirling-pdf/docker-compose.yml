# Compose file for the stirling-pdf card.
# The host port comes from card.env. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait

name: stirling-pdf

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.2.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STIRLING_PDF_PORT:?set STIRLING_PDF_PORT in card.env}:8080"
    environment:
      # The Edgible org login is in front, so Stirling-PDF's own login stays off.
      SECURITY_ENABLELOGIN: "false"
      DISABLE_ADDITIONAL_FEATURES: "true"
      SYSTEM_MAXFILESIZE: "100"
      SYSTEM_GOOGLEVISIBILITY: "false"
      METRICS_ENABLED: "false"
      SHOW_SURVEY: "false"
    volumes:
      - stirling-pdf-config:/configs
      - stirling-pdf-tessdata:/usr/share/tessdata
      - stirling-pdf-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/info/status | grep -q UP"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  stirling-pdf-config: {}
  stirling-pdf-tessdata: {}
  stirling-pdf-logs: {}
