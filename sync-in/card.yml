apiVersion: v1
kind: Card
metadata:
  name: sync-in
  description: Sync-in, your own file storage with sharing and permissions, for its desktop and CLI sync clients and the web
  type: app
  added: 2026-11-01
  homepage: https://sync-in.com
  license: AGPL-3.0-only
  steward: edgible-org

applications:
  - name: sync-in
    what: Sync-in, for the web, the desktop client and the CLI
    from: syncin/server:2.6.2
    database: mariadb:11.8.3
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: sync-in

secrets:
  SYNC_IN_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: sync-in-db
      command: mariadb -uroot -p"$(cat /run/card-secrets/SYNC_IN_DB_ROOT_PASSWORD)" -e "ALTER USER 'sync_in'@'%' IDENTIFIED BY '$SYNC_IN_DB_PASSWORD'"
  SYNC_IN_DB_ROOT_PASSWORD:
    kind: internal
    use: encryption           # set only when the database is first made, so it is carried on a move
    make: openssl rand -hex 16
  SYNC_IN_ACCESS_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  SYNC_IN_REFRESH_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  SYNC_IN_ENCRYPTION_KEY:
    kind: internal
    use: encryption
    make: openssl rand -hex 32
  SYNC_IN_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in, made by Sync-in at its first start; change it in the app after

data:
  volumes:
    sync-in-data:
      class: irreplaceable
    sync-in-db-data:
      class: irreplaceable
      dump:
        service: sync-in-db
        command: mariadb-dump -u"$MARIADB_USER" -p"$(cat "$MARIADB_PASSWORD_FILE")" --single-transaction "$MARIADB_DATABASE"
        restore: mariadb -u"$MARIADB_USER" -p"$(cat "$MARIADB_PASSWORD_FILE")" "$MARIADB_DATABASE"
    sync-in-secrets:
      class: irreplaceable
  fingerprint:
    service: sync-in-db
    command: mariadb -N -u"$MARIADB_USER" -p"$(cat "$MARIADB_PASSWORD_FILE")" "$MARIADB_DATABASE" -e "select json_object('users', count(*)) from users"

places:
  sync-in:
    memory: 1 GB
    disk: 4 GB
    arch: [amd64, arm64]
    gpu: none
