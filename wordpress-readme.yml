why: >-
  WordPress runs a large share of the web, and most of it sits with a host you pay every month.
  [WordPress](https://wordpress.org) runs just as well on a machine you own, with the database
  beside it.
what: >-
  One app, `wordpress`, on the place `wordpress`, on `none`: it is a public site. Its admin,
  `/wp-admin`, is on the same hostname, because WordPress sends every request to its one address;
  Edgible's auth is per hostname, so the admin cannot be put behind `org` on its own. WordPress's
  login protects it.


  WordPress keeps its address in its settings, so `WP_HOME` and `WP_SITEURL` are
  `https://wordpress.<ORG_LABEL>.<EDGIBLE_DOMAIN>`, or `WORDPRESS_URL` on your own domain. A fresh
  WordPress hands its admin to whoever opens its install page first, so the card publishes it on
  `org` first: only your Edgible organization reaches it while you answer WordPress's own setup
  (its language, the site's title, your admin and password). Then you open it to everyone.


  The images are `wordpress:7.1.4-php8.3-apache`, `mariadb:11.8.9`, and `wordpress:cli-2.12.0-php8.3`.
  To use it in a card, copy the four services, the `x-wordpress-env` block, the three volumes,
  card.yml's `secrets:` and `setup:`, and the `WORDPRESS_` lines.
data: >-
  Your posts, pages, users and settings are in the database volume `wordpress-db-data`; uploads,
  themes and plugins are in `wordpress-files`; the database password is in `wordpress-secrets`.
  Back up all three.
edit: >-
  Set `DEVICE` to a name `edgible device list` prints, and `ORG_LABEL` to the part after the app
  name in a hostname `edgible app list` prints. There are no passwords to fill: Start makes the
  database's on the machine, and you choose the admin's in WordPress's setup.
start: ""
setup:
  wordpress: >-
    Use a password manager for the admin's password: the site is public once you open it.
verify:
  wordpress: >-
    That prints `200`: the installed site. Sign in at `https://<wordpress hostname>/wp-admin` with
    the admin you made in Set up.


    WordPress cannot send email from most home machines, so its "Lost your password?" link may
    not work. To set a new password for a user, on the machine:
    `docker compose --env-file wordpress/card.env -f wordpress/docker-compose.yml --profile cli run --rm -T wordpress-cli wp user update <user> --prompt=user_pass`.
docs: [WordPress, https://wordpress.org/documentation/]
