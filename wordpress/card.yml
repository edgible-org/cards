apiVersion: v1
kind: Card
metadata:
  name: wordpress
  description: WordPress with MariaDB, installed before it goes public
  type: app
  added: 2026-10-09
  homepage: https://wordpress.org
  steward: edgible-org

applications:
  - name: wordpress
    what: WordPress, the site and its /wp-admin
    from: wordpress:7.1.4-php8.3-apache
    database: mariadb:11.8.9
    port: 8085
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: wordpress

secrets:
  WORDPRESS_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    on-move: carry            # MariaDB keeps it in its data, and its root password is random
  WORDPRESS_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: admin's sign-in, set by prepare.sh

data:
  volumes:
    wordpress-db-data:
      class: irreplaceable
      dump:
        service: wordpress-db
        command: mariadb-dump -u wordpress -p"$(cat /run/card-secrets/WORDPRESS_DB_PASSWORD)" --single-transaction wordpress
        restore: mariadb -u wordpress -p"$(cat /run/card-secrets/WORDPRESS_DB_PASSWORD)" wordpress
    wordpress-files:
      class: irreplaceable        # uploaded media, themes and plugins
    wordpress-secrets:
      class: irreplaceable        # the card's secrets, made on the device: back up with the data
  fingerprint:
    service: wordpress-db
    command: mariadb -N -u wordpress -p"$(cat /run/card-secrets/WORDPRESS_DB_PASSWORD)" wordpress -e "select json_object('users', (select count(*) from wp_users), 'posts', (select count(*) from wp_posts where post_status = 'publish'))"

places:
  wordpress:
    memory: 384 MB
    disk: 2 GB
    arch: [amd64, arm64]
    gpu: none
