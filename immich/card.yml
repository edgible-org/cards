apiVersion: v1
kind: Card
metadata:
  name: immich
  description: Immich, your photo and video library, for its phone apps and the web
  type: app
  added: 2026-10-09
  homepage: https://immich.app
  steward: edgible-org

applications:
  - name: immich
    what: Immich web, API, and phone app uploads
    from: ghcr.io/immich-app/immich-server:v3.3.1
    database: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    port: 2283
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    setup:
      behind: org
      done: curl -fsS "http://127.0.0.1:$IMMICH_PORT/api/server/config" | grep -q '"isInitialized":true'
    place: immich

secrets:
  IMMICH_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: immich-db
      command: psql -U immich -d immich -c "ALTER USER immich PASSWORD '$IMMICH_DB_PASSWORD'"

places:
  immich:
    memory: 6 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: optional
