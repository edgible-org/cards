apiVersion: v1
kind: Card
metadata:
  name: memos
  description: Memos, a private note-taking app on a SQLite file, for the web and its phone apps
  type: app
  added: 2026-10-29
  homepage: https://usememos.com/
  license: MIT
  steward: edgible-org

applications:
  - name: memos
    what: Memos, for the web and the phone apps
    from: neosmemo/memos:0.31.0
    port: 5230
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    appPaths:
      - paths: [/api/v1/*, /file/*]
        for: Memos' phone apps, their calls and attachments, each with a Memos token or password
    setup:
      behind: org
      done: curl -fsS "http://127.0.0.1:$MEMOS_PORT/api/v1/instance/profile" | grep -q '"admin"' && curl -fsS "http://127.0.0.1:$MEMOS_PORT/api/v1/instance/settings/GENERAL" | grep -q '"disallowUserRegistration":true'
    place: memos

data:
  volumes:
    memos-data:
      class: irreplaceable
  fingerprint:
    service: memos
    command: 'printf ''{"admins": %s}\n'' "$(wget -qO- http://127.0.0.1:5230/api/v1/instance/profile | grep -c ''"admin"'' || true)"'

places:
  memos:
    memory: 256 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
