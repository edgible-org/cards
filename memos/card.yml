apiVersion: v1
kind: Card
metadata:
  name: memos
  description: Memos, a private note-taking app on a SQLite file, for the web and its phone apps
  type: app
  added: 2026-10-29
  homepage: https://usememos.com/
  license: MIT
  steward: edgible-org

applications:
  - name: memos
    what: Memos, for the web and the phone apps
    from: neosmemo/memos:0.31.0
    port: 5230
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: memos

secrets:
  MEMOS_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in, set by prepare.sh; change it under Settings after

data:
  volumes:
    memos-data:
      class: irreplaceable
    memos-secrets:
      class: irreplaceable
  fingerprint:
    service: memos
    command: 'printf ''{"admins": %s}\n'' "$(wget -qO- http://127.0.0.1:5230/api/v1/instance/profile | grep -c ''"admin"'' || true)"'

places:
  memos:
    memory: 256 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
